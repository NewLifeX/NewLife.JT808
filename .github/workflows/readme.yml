name: readme

# README 语言切换行、指标徽章与 NuGet 包版由脚本从配置生成，多语言词表由 check-locales 校验。
# 手工改顺序、或某一份副本忘记同步，都会在这里被拦下。
on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'Tools/Scripts/**'
      - 'Newlife.JT808/Locales/**'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'Tools/Scripts/**'
      - 'Newlife.JT808/Locales/**'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: check readme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-languages.ps1 -Check
    - name: Check README metrics
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-metrics.ps1 -Check
    - name: Check README package copy
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-package.ps1 -Check
    - name: Check locale tables
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/check-locales.ps1 -LocaleDir Newlife.JT808/Locales -SourceDir Newlife.JT808,JT808.Server
